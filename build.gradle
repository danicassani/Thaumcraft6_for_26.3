plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '7.0.17'
}
version = '6.1.BETA26-port.59-forge66.0.13'
group = 'griglog.thaumcraft'
base.archivesName = 'thaumcraft'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
// Forge needs one mod root. Stage each task separately so resource processing
// cannot delete compiler outputs on a clean build or a build-cache restore.
// Declare these roots before runs: ForgeGradle captures SourceSet output snapshots.
def stagedMainClasses = layout.buildDirectory.dir('staging/main/classes')
def stagedMainResources = layout.buildDirectory.dir('staging/main/resources')
def mergedMainOutput = layout.buildDirectory.dir('mod/main')
tasks.named('compileJava', JavaCompile) {
    destinationDirectory = stagedMainClasses
}
// Keep resource staging independent of SourceSet.output.resourcesDir.
// Gradle's Copy destination convention otherwise resolves to the merged mod root.
tasks.named('processResources') {
    conventionMapping.map('destinationDir') { stagedMainResources.get().asFile }
}
def mergeMainMod = tasks.register('mergeMainMod', Sync) {
    dependsOn tasks.named('compileJava'), tasks.named('processResources')
    from stagedMainClasses
    from stagedMainResources
    into mergedMainOutput
}
sourceSets.main.output.classesDirs.setFrom(files(mergedMainOutput).builtBy(mergeMainMod))
sourceSets.main.output.resourcesDir = mergedMainOutput.get().asFile
sourceSets.main.output.builtBy(mergeMainMod)
tasks.named('classes') { dependsOn mergeMainMod }

// Reversible quarantine: 1.12.2 sources and resources stay intact.
sourceSets.main {
    java.setSrcDirs(['src/modern/java'])
    resources.setSrcDirs(['src/modern/resources'])
}
// Explicit integration fixtures; never packaged by the normal build.
if (providers.gradleProperty('worldgenProbe').isPresent()) { sourceSets.main.java.srcDir('src/worldgenTest/java') }
if (providers.gradleProperty('thaumaturgyProbe').isPresent()) { sourceSets.main.java.srcDir('src/thaumaturgyTest/java') }

if (providers.gradleProperty('bookProbe').isPresent()) { sourceSets.main.java.srcDir('src/bookTest/java'); sourceSets.main.java.srcDir('src/eldritchTest/java') }
if (providers.gradleProperty('eldritchProbe').isPresent()) { sourceSets.main.java.srcDir('src/eldritchTest/java') }
if (providers.gradleProperty('infusionProbe').isPresent()) {
    sourceSets.main.java.srcDir('src/infusionTest/java')
}
if (providers.gradleProperty('essentiaProbe').isPresent()) {
    sourceSets.main.java.srcDir('src/essentiaTest/java')
}
if (providers.gradleProperty('alchemyProbe').isPresent()) {
    sourceSets.main.java.srcDir('src/alchemyTest/java')
}
if (providers.gradleProperty('theoryProbe').isPresent()) {
    sourceSets.main.java.srcDir('src/theoryTest/java')
}
if (providers.gradleProperty('knowledgeProbe').isPresent()) {
    sourceSets.main.java.srcDir('src/knowledgeTest/java')
}
if (providers.gradleProperty('arcaneRiftProbe').isPresent()) {
    sourceSets.main.java.srcDir('src/arcaneRiftTest/java')
}
if (providers.gradleProperty('m05Probe').isPresent()) {
    sourceSets.main.java.srcDir('src/deviceTest/java')
    sourceSets.main.resources.srcDir('src/deviceTest/resources')
}
if (providers.gradleProperty('auraProbe').isPresent()) {
    sourceSets.main.java.srcDir('src/auraTest/java')
}

if (providers.gradleProperty('warpRestartProbe').isPresent()) {
    sourceSets.main.java.srcDir('src/runtimeTest/java')
}

if (providers.gradleProperty('basicContentProbe').isPresent()) {
    sourceSets.main.java.srcDir('src/contentTest/java')
}

minecraft {
    accessTransformer.from(file('src/modern/resources/META-INF/accesstransformer.cfg'))
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            if (providers.gradleProperty('thaumaturgyProbe').isPresent()) systemProperty 'thaumcraft.thaumaturgyProbe', providers.gradleProperty('thaumaturgyProbe').get()
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            if (providers.gradleProperty('worldgenProbe').isPresent()) systemProperty 'thaumcraft.worldgenProbe', providers.gradleProperty('worldgenProbe').get()
            if (providers.gradleProperty('bookProbe').isPresent()) systemProperty 'thaumcraft.bookProbe', providers.gradleProperty('bookProbe').get()
            if (providers.gradleProperty('eldritchProbe').isPresent()) systemProperty 'thaumcraft.eldritchProbe', providers.gradleProperty('eldritchProbe').get()
            if (providers.gradleProperty('infusionProbe').isPresent()) systemProperty 'thaumcraft.infusionProbe', providers.gradleProperty('infusionProbe').get()
            if (providers.gradleProperty('essentiaProbe').isPresent()) systemProperty 'thaumcraft.essentiaProbe', providers.gradleProperty('essentiaProbe').get()
            if (providers.gradleProperty('alchemyProbe').isPresent()) systemProperty 'thaumcraft.alchemyProbe', providers.gradleProperty('alchemyProbe').get()
            if (providers.gradleProperty('theoryProbe').isPresent()) systemProperty 'thaumcraft.theoryProbe', providers.gradleProperty('theoryProbe').get()
            if (providers.gradleProperty('knowledgeProbe').isPresent()) systemProperty 'thaumcraft.knowledgeProbe', providers.gradleProperty('knowledgeProbe').get()
            if (providers.gradleProperty('arcaneRiftProbe').isPresent()) systemProperty 'thaumcraft.arcaneRiftProbe', providers.gradleProperty('arcaneRiftProbe').get()
            if (providers.gradleProperty('m05Probe').isPresent()) systemProperty 'thaumcraft.m05Probe', providers.gradleProperty('m05Probe').get()
            if (providers.gradleProperty('auraProbe').isPresent()) {
                systemProperty 'thaumcraft.auraProbe', providers.gradleProperty('auraProbe').get()
            }
            mods {
                register('thaumcraft') { source sourceSets.main }
            }
        }
        register('client')
        register('server') {
            workingDir = layout.projectDirectory.dir('run/server')
            args '--nogui'
            if (providers.gradleProperty('bookProbe').isPresent()) args '--world', 'book-smoke56'
            if (providers.gradleProperty('eldritchProbe').isPresent()) args '--world', 'eldritch-smoke56'
            if (providers.gradleProperty('worldgenProbe').isPresent()) args '--world', providers.gradleProperty('worldgenProbe').get().startsWith('pech') ? 'pech-smoke54' : providers.gradleProperty('worldgenProbe').get().startsWith('decoration') ? 'decoration-smoke53' : providers.gradleProperty('worldgenProbe').get().startsWith('wisp') ? 'wisp-smoke52' : providers.gradleProperty('worldgenProbe').get().startsWith('cult') ? 'cult-smoke51' : providers.gradleProperty('worldgenProbe').get().startsWith('structures') ? 'structures-smoke50' : 'worldgen-smoke49'
            if (providers.gradleProperty('thaumaturgyProbe').isPresent()) args '--world', 'thaumaturgy-smoke'
            if (providers.gradleProperty('infusionProbe').isPresent()) args '--world', providers.gradleProperty('infusionProbe').get().startsWith('finish') ? 'infusion-smoke55' : 'infusion-smoke'
            if (providers.gradleProperty('essentiaProbe').isPresent()) args '--world', 'essentia-smoke'
            if (providers.gradleProperty('alchemyProbe').isPresent()) args '--world', 'alchemy-smoke'
            if (providers.gradleProperty('theoryProbe').isPresent()) args '--world', 'theory-smoke'
            if (providers.gradleProperty('knowledgeProbe').isPresent()) args '--world', 'knowledge-smoke'
            if (providers.gradleProperty('arcaneRiftProbe').isPresent()) args '--world', 'arcane-rifts-smoke'
            if (providers.gradleProperty('m05Probe').isPresent()) args '--world', 'm05-devices-smoke'
            if (providers.gradleProperty('auraProbe').isPresent()) args '--world', 'aura-step5-smoke'
            if (providers.gradleProperty('basicContentProbe').isPresent()) {
                args '--world', providers.gradleProperty('basicContentProbe').get().with { it ? it : 'basic-content-smoke' }
            }
        }
    }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.13')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    from('src/main/resources') { include 'assets/thaumcraft/textures/**' }
}

tasks.named('test') { useJUnitPlatform() }
tasks.register('checkModelResources', Exec) {
    group = 'verification'
    description = 'Validate model texture files, aliases and atlas registration (requires Python 3).'
    dependsOn tasks.named('processResources')
    def python = providers.gradleProperty('pythonExecutable').getOrElse(
            System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3')
    commandLine python, layout.projectDirectory.file('tools/verify_model_resources.py').asFile,
            stagedMainResources.get().asFile
}
tasks.named('check') { dependsOn tasks.named('checkModelResources') }
tasks.register('checkLootResources', Exec) {
    group = 'verification'
    description = 'Reject obsolete loot fields that the native codec can ignore.'
    dependsOn tasks.named('processResources')
    def python = providers.gradleProperty('pythonExecutable').getOrElse(
            System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3')
    commandLine python, layout.projectDirectory.file('tools/verify_loot_resources.py').asFile,
            stagedMainResources.get().asFile
}
tasks.named('check') { dependsOn tasks.named('checkLootResources') }
tasks.register('checkWarpCodec') { dependsOn tasks.named('test') }

tasks.withType(JavaExec).configureEach {
    if (name == 'runServer') standardInput = System.in
}
